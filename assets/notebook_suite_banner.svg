<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Large Language Models in Finance notebook suite</title>
  <desc id="desc">A dark blue banner showing evidence, models, controls, and decisions connected in a governed pipeline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081C2C"/>
      <stop offset="1" stop-color="#163D5C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <circle cx="1045" cy="55" r="150" fill="#19A7A0" opacity=".11"/>
  <circle cx="1150" cy="285" r="175" fill="#FF7A59" opacity=".10"/>
  <g fill="none" stroke="#6ED4CD" stroke-width="3" opacity=".75">
    <path d="M710 176 H775"/>
    <path d="M875 176 H940"/>
    <path d="M1040 176 H1090"/>
  </g>
  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="635" y="128" width="110" height="96" rx="18" fill="#F7F2EA"/>
    <rect x="775" y="128" width="110" height="96" rx="18" fill="#F7F2EA"/>
    <rect x="940" y="128" width="110" height="96" rx="18" fill="#F7F2EA"/>
    <rect x="1090" y="128" width="80" height="96" rx="18" fill="#F7F2EA"/>
    <g fill="#0C2A40" font-size="17" font-weight="700" text-anchor="middle">
      <text x="690" y="169">TIME-VALID</text><text x="690" y="193">EVIDENCE</text>
      <text x="830" y="169">MODEL</text><text x="830" y="193">PROPOSAL</text>
      <text x="995" y="169">POLICY</text><text x="995" y="193">GATE</text>
      <text x="1130" y="169">HUMAN</text><text x="1130" y="193">REVIEW</text>
    </g>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#FFFFFF">
    <text x="64" y="91" font-size="24" font-weight="700" letter-spacing="2.5" fill="#6ED4CD">COMPANION NOTEBOOK SUITE</text>
    <text x="64" y="151" font-size="47" font-weight="800">Large Language Models</text>
    <text x="64" y="205" font-size="47" font-weight="800">in Finance</text>
    <text x="64" y="260" font-size="21" fill="#D7E7EF">17 core labs + 1 optional bridge · point-in-time data · governed agents</text>
  </g>
</svg>
